name: ALIS Next.js CI

on:
  push:
    branches: [main, "feat/legal-situation-triage", "fix/vercel-nextjs-deployment"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock
      - name: Build Next.js app
        run: npm run build
